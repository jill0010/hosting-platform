name: Frontend Smoke Checks
on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'scripts/check-frontend.py'
      - 'scripts/check-inline-js.py'
      - '.github/workflows/frontend-smoke.yml'
  pull_request:
    paths:
      - 'frontend/**'
      - 'scripts/check-frontend.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify frontend pages and links
        run: python3 scripts/check-frontend.py
      - name: Check inline JavaScript syntax
        run: python3 scripts/check-inline-js.py
